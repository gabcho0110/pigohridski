<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="800" height="880" role="img" aria-label="Илюстрация на училищната сграда">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf3"/>
      <stop offset=".5" stop-color="#f5ecda"/>
      <stop offset="1" stop-color="#eadfc8"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ead6"/>
      <stop offset="1" stop-color="#e4d5b9"/>
    </linearGradient>
    <linearGradient id="risalit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f0e0"/>
      <stop offset="1" stop-color="#e9dcc3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b4a7d"/>
      <stop offset="1" stop-color="#0b2b4f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d6bd"/>
      <stop offset="1" stop-color="#d3c3a4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="880" fill="url(#sky)"/>
  <circle cx="628" cy="168" r="92" fill="#ecd9ad" opacity=".55"/>
  <circle cx="628" cy="168" r="64" fill="#f0e0bb" opacity=".6"/>

  <!-- distant skyline -->
  <g opacity=".22" fill="#9aa7b4">
    <rect x="0" y="470" width="70" height="250"/>
    <rect x="60" y="520" width="46" height="200"/>
    <rect x="700" y="490" width="58" height="230"/>
    <rect x="752" y="535" width="48" height="185"/>
  </g>

  <!-- trees behind -->
  <g fill="#8b9a80" opacity=".55">
    <ellipse cx="96" cy="612" rx="66" ry="72"/>
    <ellipse cx="726" cy="600" rx="72" ry="78"/>
  </g>

  <!-- main block -->
  <rect x="118" y="300" width="564" height="404" fill="url(#wall)"/>
  <rect x="118" y="300" width="564" height="14" fill="#cbb894"/>
  <rect x="110" y="288" width="580" height="14" fill="#0b2b4f" opacity=".85"/>
  <rect x="110" y="288" width="580" height="4" fill="#c19a45"/>

  <!-- side wings shade -->
  <rect x="118" y="314" width="60" height="390" fill="#000" opacity=".03"/>
  <rect x="622" y="314" width="60" height="390" fill="#000" opacity=".03"/>

  <!-- windows: floor 1 -->
  <g fill="url(#glass)">
    <g>
      <path d="M150 356a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M216 356a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M282 356a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M478 356a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M544 356a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M610 356a21 21 0 0 1 42 0v56h-42z"/>
    </g>
    <g>
      <path d="M150 448a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M216 448a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M282 448a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M478 448a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M544 448a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M610 448a21 21 0 0 1 42 0v56h-42z"/>
    </g>
    <g>
      <path d="M150 540a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M216 540a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M282 540a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M478 540a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M544 540a21 21 0 0 1 42 0v56h-42z"/>
      <path d="M610 540a21 21 0 0 1 42 0v56h-42z"/>
    </g>
  </g>
  <!-- window mullions -->
  <g stroke="#c19a45" stroke-width="2" opacity=".55">
    <path d="M171 356v56M237 356v56M303 356v56M499 356v56M565 356v56M631 356v56"/>
    <path d="M171 448v56M237 448v56M303 448v56M499 448v56M565 448v56M631 448v56"/>
    <path d="M171 540v56M237 540v56M303 540v56M499 540v56M565 540v56M631 540v56"/>
  </g>

  <!-- central risalit -->
  <rect x="332" y="252" width="136" height="452" fill="url(#risalit)"/>
  <rect x="326" y="252" width="148" height="8" fill="#cbb894"/>

  <!-- pediment -->
  <path d="M400 196 486 254H314z" fill="#f6eddb" stroke="#c19a45" stroke-width="3"/>
  <circle cx="400" cy="232" r="13" fill="none" stroke="#c19a45" stroke-width="2.5"/>
  <circle cx="400" cy="232" r="4" fill="#c19a45"/>

  <!-- flag -->
  <path d="M400 196v-52" stroke="#0b2b4f" stroke-width="3"/>
  <g>
    <rect x="402" y="146" width="46" height="11" fill="#f7f4ec" stroke="#d8d2c2" stroke-width=".7"/>
    <rect x="402" y="157" width="46" height="11" fill="#4a8f5c"/>
    <rect x="402" y="168" width="46" height="11" fill="#b8483c"/>
  </g>

  <!-- risalit windows -->
  <g fill="url(#glass)">
    <path d="M382 300a18 18 0 0 1 36 0v48h-36z"/>
    <path d="M382 384a18 18 0 0 1 36 0v48h-36z"/>
  </g>
  <g stroke="#c19a45" stroke-width="2" opacity=".55">
    <path d="M400 300v48M400 384v48"/>
  </g>

  <!-- columns -->
  <g fill="#efe4cd" stroke="#cbb894" stroke-width="1.5">
    <rect x="336" y="470" width="14" height="150"/>
    <rect x="356" y="470" width="14" height="150"/>
    <rect x="430" y="470" width="14" height="150"/>
    <rect x="450" y="470" width="14" height="150"/>
  </g>

  <!-- entrance arch -->
  <path d="M366 700V596a34 34 0 0 1 68 0v104z" fill="#0b2b4f"/>
  <path d="M366 700V596a34 34 0 0 1 68 0v104" fill="none" stroke="#c19a45" stroke-width="3"/>
  <path d="M400 566v134" stroke="#c19a45" stroke-width="1.4" opacity=".5"/>
  <path d="M366 632h68" stroke="#c19a45" stroke-width="1.4" opacity=".5"/>
  <circle cx="392" cy="664" r="3" fill="#c19a45"/>

  <!-- cornice above entrance -->
  <rect x="352" y="452" width="96" height="8" fill="#cbb894"/>

  <!-- ground + steps -->
  <rect x="0" y="704" width="800" height="176" fill="url(#ground)"/>
  <rect x="330" y="704" width="140" height="12" fill="#ded0b3"/>
  <rect x="318" y="716" width="164" height="12" fill="#d8c9aa"/>
  <rect x="306" y="728" width="188" height="12" fill="#d2c2a1"/>

  <!-- path -->
  <path d="M306 740h188l72 140H234z" fill="#e6dac2" opacity=".85"/>

  <!-- lawn hints -->
  <g fill="#9aa88f" opacity=".5">
    <rect x="0" y="740" width="234" height="140"/>
    <rect x="566" y="740" width="234" height="140"/>
  </g>

  <!-- foreground trees -->
  <g>
    <rect x="86" y="640" width="9" height="76" fill="#6b5b45" opacity=".65"/>
    <ellipse cx="90" cy="600" rx="62" ry="66" fill="#7f8f74"/>
    <ellipse cx="72" cy="612" rx="40" ry="42" fill="#8b9a80" opacity=".8"/>
  </g>
  <g>
    <rect x="712" y="628" width="10" height="88" fill="#6b5b45" opacity=".65"/>
    <ellipse cx="716" cy="586" rx="70" ry="74" fill="#75866b"/>
    <ellipse cx="736" cy="600" rx="44" ry="46" fill="#8b9a80" opacity=".75"/>
  </g>

  <!-- birds -->
  <g stroke="#0b2b4f" stroke-width="2" fill="none" opacity=".35" stroke-linecap="round">
    <path d="M214 148c6-6 12-6 18 0M236 136c5-5 10-5 15 0M196 168c5-5 10-5 15 0"/>
  </g>
</svg>
